<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>becauseyoulovejira läuft nicht</title>
		<!--
			Offline hint of the installed web app (ADR-0035 section 8; plan start-fenster, SF-5). The
			service worker keeps only this page and shows it when a navigation of the app finds no
			server. It holds no data of the app. Self-contained with system colors like the landing
			page; it checks /api/health and loads the address again once the app runs.
		-->
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, 'Segoe UI', sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				background: Canvas;
				color: CanvasText;
			}

			main {
				max-width: 36rem;
				margin: 12vh auto 0;
				padding: 1.5rem;
			}

			h1 {
				margin: 0 0 1rem;
				font-size: 1.5rem;
				letter-spacing: -0.01em;
			}

			p {
				margin: 0 0 0.75rem;
			}

			button {
				padding: 0.375rem 0.875rem;
				border: 1px solid ButtonBorder;
				border-radius: 0.375rem;
				background: ButtonFace;
				color: ButtonText;
				font: inherit;
				cursor: pointer;
			}

			button:focus-visible {
				outline: 2px solid Highlight;
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1 id="byl-title" tabindex="-1">becauseyoulovejira läuft gerade nicht</h1>
			<p id="byl-status" role="status" aria-live="polite">
				Starte die App mit start.bat im Ordner app. Diese Seite lädt neu, sobald sie wieder läuft.
			</p>
			<button type="button" id="byl-retry">Erneut versuchen</button>
		</main>
		<script>
			(function (win, doc) {
				'use strict';

				var VISIBLE_MS = 2000;
				var HIDDEN_MS = 10000;
				var timer = null;

				function reload() {
					win.location.reload();
				}

				function interval() {
					return doc.visibilityState === 'hidden' ? HIDDEN_MS : VISIBLE_MS;
				}

				function check() {
					win.fetch('/api/health', { cache: 'no-store' }).then(
						function (response) {
							if (response.ok) reload();
							else later();
						},
						later
					);
				}

				function later() {
					win.clearTimeout(timer);
					timer = win.setTimeout(check, interval());
				}

				doc.getElementById('byl-retry').addEventListener('click', reload);
				doc.getElementById('byl-title').focus();
				later();
			})(window, document);
		</script>
	</body>
</html>
