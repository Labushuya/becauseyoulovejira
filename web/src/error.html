<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Fehler · becauseyoulovejira</title>
		<!--
			Emergency page of SvelteKit (ADR-0040): shown when even the root layout or the error page
			of the app could not be loaded, for example while a new build replaced the files. SvelteKit
			puts it into the open document, so a script in it would not run; the button uses an
			attribute instead. The message comes from src/hooks.client.ts. Self-contained with system
			colors like offline.html, nothing from outside.
		-->
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, 'Segoe UI', sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				background: Canvas;
				color: CanvasText;
			}

			main {
				max-width: 36rem;
				margin: 12vh auto 0;
				padding: 1.5rem;
			}

			h1 {
				margin: 0 0 1rem;
				font-size: 1.5rem;
				letter-spacing: -0.01em;
			}

			p {
				margin: 0 0 0.75rem;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
				align-items: center;
				margin-top: 1.5rem;
			}

			button {
				padding: 0.375rem 0.875rem;
				border: 1px solid ButtonBorder;
				border-radius: 0.375rem;
				background: ButtonFace;
				color: ButtonText;
				font: inherit;
				cursor: pointer;
			}

			a {
				color: LinkText;
			}

			button:focus-visible,
			a:focus-visible {
				outline: 2px solid Highlight;
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>becauseyoulovejira konnte nicht geladen werden</h1>
			<p>
				%sveltekit.error.message% Lade die Seite neu, das hilft meist, wenn die App gerade
				aktualisiert oder neu gestartet wurde.
			</p>
			<p>Fehlercode %sveltekit.status%</p>
			<p class="actions">
				<button type="button" onclick="location.reload()">Neu laden</button>
				<a href="/" data-sveltekit-reload>Zur Übersicht</a>
			</p>
		</main>
	</body>
</html>
