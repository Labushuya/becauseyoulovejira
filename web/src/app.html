<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Theme before the first paint (ADR-0025 section 10; keys as in src/lib/theme.svelte.ts):
			// only "light" and "dark" set data-theme, anything else keeps the system setting. The
			// value of the old key td-theme moves over once. Without storage the system setting applies.
			(function () {
				try {
					var key = 'byl-theme';
					var value = localStorage.getItem(key);
					if (value === null) {
						var legacy = localStorage.getItem('td-theme');
						if (legacy === 'light' || legacy === 'dark') {
							localStorage.setItem(key, legacy);
							value = legacy;
						}
						localStorage.removeItem('td-theme');
					}
					if (value === 'light' || value === 'dark') {
						document.documentElement.setAttribute('data-theme', value);
					}
				} catch (error) {
					// Storage blocked: the system setting applies.
				}
				// Accent theme (ADR-0027 section 6; key, allowlist and old values as in
				// src/lib/accent.svelte.ts): only an allowed value sets data-accent, anything else keeps
				// Petrol. Since the addendum of 2026-09-27 a stored "honig" becomes "kupfer" and a stored
				// "purpur" becomes Petrol, once, before the first paint.
				try {
					var accents = ['rubin', 'smaragd', 'kupfer'];
					var accent = localStorage.getItem('byl-accent');
					if (accent === 'honig') {
						accent = 'kupfer';
						document.documentElement.setAttribute('data-accent', accent);
						localStorage.setItem('byl-accent', accent);
					} else if (accent === 'purpur') {
						localStorage.removeItem('byl-accent');
					}
					if (accents.indexOf(accent) !== -1) {
						document.documentElement.setAttribute('data-accent', accent);
					}
				} catch (error) {
					// Storage blocked: Petrol applies.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
