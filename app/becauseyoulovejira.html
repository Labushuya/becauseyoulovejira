<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>becauseyoulovejira</title>
		<!--
			Entry per double click next to start.bat (ADR-0035 section 1; plan start-fenster, SF-2).
			Self-contained: no external script, style or font, and only system colors, so light,
			dark and forced colors work without copying tokens.css. It checks whether the app runs
			on http://127.0.0.1:8090/, asks the server whether an app tab is open already and opens
			the app in this tab otherwise. The link "App öffnen" always works, also without script.
		-->
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, 'Segoe UI', sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				background: Canvas;
				color: CanvasText;
			}

			main {
				max-width: 36rem;
				margin: 12vh auto 0;
				padding: 1.5rem;
			}

			h1 {
				margin: 0 0 1rem;
				font-size: 1.5rem;
				letter-spacing: -0.01em;
			}

			p {
				margin: 0 0 0.75rem;
			}

			.muted {
				color: GrayText;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				align-items: center;
				margin-top: 1.25rem;
			}

			button,
			.open {
				padding: 0.375rem 0.875rem;
				border: 1px solid ButtonBorder;
				border-radius: 0.375rem;
				background: ButtonFace;
				color: ButtonText;
				font: inherit;
				cursor: pointer;
				text-decoration: none;
			}

			.open {
				border-color: LinkText;
				color: LinkText;
			}

			button:focus-visible,
			.open:focus-visible {
				outline: 2px solid Highlight;
				outline-offset: 2px;
			}

			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<main>
			<h1 id="byl-title" tabindex="-1">becauseyoulovejira</h1>
			<p id="byl-status" role="status" aria-live="polite">Prüfe, ob die App läuft …</p>
			<p id="byl-checked" class="muted" hidden></p>
			<noscript>
				<p>Ohne JavaScript: start.bat ausführen und http://127.0.0.1:8090/ öffnen.</p>
			</noscript>
			<div class="actions">
				<button type="button" id="byl-now" hidden>Jetzt öffnen</button>
				<button type="button" id="byl-close" hidden>Jetzt schließen</button>
				<button type="button" id="byl-here" hidden>Trotzdem hier öffnen</button>
				<button type="button" id="byl-cancel" hidden>Abbrechen</button>
				<button type="button" id="byl-retry" hidden>Erneut prüfen</button>
				<a id="byl-open" class="open" href="http://127.0.0.1:8090/">App öffnen</a>
			</div>
		</main>
		<script>
			(function (win, doc) {
				'use strict';

				var APP_URL = 'http://127.0.0.1:8090/';
				var HEALTH_URL = APP_URL + 'api/health';
				var ATTENTION_URL = APP_URL + 'api/byl/attention';
				var COUNTDOWN_S = 5;
				var REQUEST_TIMEOUT_MS = 1500;
				var PROBE_VISIBLE_MS = 1000;
				var PROBE_HIDDEN_MS = 5000;
				var ACK_WAIT_MS = 2000;
				var ACK_STEP_MS = 250;
				var CLOSE_CHECK_MS = 300;
				var NONCE = /^[A-Za-z0-9]{24}$/;

				// Pure state machine. Phases: checking (first probe), down (server not reachable),
				// asking (server up, asking for an open tab), countdown, cancelled, opening,
				// elsewhere (a tab confirmed; this one closes), kept, closing, closed (close failed).
				function next(state, event) {
					var phase = state.phase;
					switch (event.type) {
						case 'probe':
							if (phase !== 'checking' && phase !== 'down') return state;
							if (!event.up) return { phase: 'down', remaining: 0, firstUp: false };
							return { phase: 'asking', remaining: 0, firstUp: phase === 'checking' };
						case 'answer':
							if (phase !== 'asking') return state;
							if (event.acked) return { phase: 'elsewhere', remaining: COUNTDOWN_S, firstUp: state.firstUp };
							if (state.firstUp) return { phase: 'opening', remaining: 0, firstUp: true };
							return { phase: 'countdown', remaining: COUNTDOWN_S, firstUp: false };
						case 'tick':
							if (phase !== 'countdown' && phase !== 'elsewhere') return state;
							if (state.remaining > 1) {
								return { phase: phase, remaining: state.remaining - 1, firstUp: state.firstUp };
							}
							return { phase: phase === 'countdown' ? 'opening' : 'closing', remaining: 0, firstUp: state.firstUp };
						case 'cancel':
							if (phase === 'countdown') return { phase: 'cancelled', remaining: 0, firstUp: state.firstUp };
							if (phase === 'elsewhere') return { phase: 'kept', remaining: 0, firstUp: state.firstUp };
							return state;
						case 'now':
							return phase === 'countdown' || phase === 'cancelled'
								? { phase: 'opening', remaining: 0, firstUp: state.firstUp }
								: state;
						case 'here':
							return phase === 'elsewhere' || phase === 'kept' || phase === 'closed'
								? { phase: 'opening', remaining: 0, firstUp: state.firstUp }
								: state;
						case 'close':
							return phase === 'elsewhere' || phase === 'kept'
								? { phase: 'closing', remaining: 0, firstUp: state.firstUp }
								: state;
						case 'closeFailed':
							return phase === 'closing' ? { phase: 'closed', remaining: 0, firstUp: state.firstUp } : state;
						default:
							return state;
					}
				}

				var INITIAL = { phase: 'checking', remaining: 0, firstUp: false };
				win.BylLanding = { next: next, INITIAL: INITIAL, APP_URL: APP_URL, COUNTDOWN_S: COUNTDOWN_S };

				// Loaded over http after all: the app itself lives at the root of that server.
				if (win.location.protocol !== 'file:') {
					win.location.replace('/');
					return;
				}

				var element = function (id) {
					return doc.getElementById(id);
				};
				var title = element('byl-title');
				var status = element('byl-status');
				var checked = element('byl-checked');
				var buttons = {
					now: element('byl-now'),
					close: element('byl-close'),
					here: element('byl-here'),
					cancel: element('byl-cancel'),
					retry: element('byl-retry')
				};

				// Only the first text of a phase goes into the live region: no announcement per second.
				var STATUS = {
					checking: 'Prüfe, ob die App läuft …',
					down: 'Die App läuft noch nicht. Starte sie mit start.bat im selben Ordner. Diese Seite erkennt den Start von selbst.',
					asking: 'Die App läuft. Prüfe, ob sie schon in einem anderen Tab offen ist …',
					countdown: 'Die App läuft und öffnet sich in 5 Sekunden.',
					cancelled: 'Automatisches Öffnen abgebrochen. Die App läuft, „App öffnen“ bringt dich hin.',
					opening: 'Die App wird geöffnet …',
					elsewhere:
						'becauseyoulovejira ist schon in einem anderen Tab offen. Dort erscheint ein Hinweis. Dieser Tab schließt sich in 5 Sekunden.',
					kept: 'becauseyoulovejira ist schon in einem anderen Tab offen. Dort erscheint ein Hinweis.',
					closing: 'Dieser Tab wird geschlossen …',
					closed: 'Du kannst diesen Tab jetzt schließen.'
				};
				var VISIBLE = {
					now: ['countdown'],
					close: ['elsewhere', 'kept'],
					here: ['elsewhere', 'kept', 'closed'],
					cancel: ['countdown', 'elsewhere'],
					retry: ['down']
				};

				var state = INITIAL;
				var timer = null;

				function render(previous) {
					var phase = state.phase;
					if (previous === null || previous.phase !== phase) status.textContent = STATUS[phase];
					for (var name in buttons) {
						buttons[name].hidden = VISIBLE[name].indexOf(phase) === -1;
					}
					buttons.now.textContent = 'Jetzt öffnen (' + state.remaining + ' s)';
					buttons.close.textContent =
						phase === 'elsewhere' ? 'Jetzt schließen (' + state.remaining + ' s)' : 'Jetzt schließen';
					checked.hidden = phase !== 'down';
				}

				function schedule(callback, ms) {
					win.clearTimeout(timer);
					timer = win.setTimeout(callback, ms);
				}

				function dispatch(event) {
					var previous = state;
					state = next(state, event);
					if (state === previous) return;
					render(previous);
					if (state.phase !== previous.phase) enter(state.phase);
					else if (state.phase === 'countdown' || state.phase === 'elsewhere') schedule(tick, 1000);
				}

				function tick() {
					dispatch({ type: 'tick' });
				}

				function enter(phase) {
					win.clearTimeout(timer);
					timer = null;
					if (phase === 'down') {
						schedule(probe, interval());
					} else if (phase === 'asking') {
						askTabs().then(function (acked) {
							dispatch({ type: 'answer', acked: acked });
						});
					} else if (phase === 'countdown' || phase === 'elsewhere') {
						schedule(tick, 1000);
					} else if (phase === 'opening') {
						win.location.replace(APP_URL);
					} else if (phase === 'closing') {
						try {
							win.close();
						} catch (error) {
							// Not allowed: the text below says what to do.
						}
						schedule(function () {
							if (!win.closed) dispatch({ type: 'closeFailed' });
						}, CLOSE_CHECK_MS);
					}
				}

				// fetch with a timeout; rejects on network errors, CORS and the timeout.
				function request(url, options) {
					var controller = new win.AbortController();
					var stop = win.setTimeout(function () {
						controller.abort();
					}, REQUEST_TIMEOUT_MS);
					options.signal = controller.signal;
					options.cache = 'no-store';
					return win.fetch(url, options).then(
						function (response) {
							win.clearTimeout(stop);
							return response;
						},
						function (error) {
							win.clearTimeout(stop);
							throw error;
						}
					);
				}

				// Reachable: /api/health answers 200. If CORS blocks the answer (TypeError), an opaque
				// answer in the no-cors mode still means the server is there.
				function reachable() {
					return request(HEALTH_URL, {}).then(
						function (response) {
							return response.ok;
						},
						function (error) {
							if (!error || error.name !== 'TypeError') return false;
							return request(HEALTH_URL, { mode: 'no-cors' }).then(
								function () {
									return true;
								},
								function () {
									return false;
								}
							);
						}
					);
				}

				function interval() {
					return doc.visibilityState === 'hidden' ? PROBE_HIDDEN_MS : PROBE_VISIBLE_MS;
				}

				// One probe at a time; while the server stays down, the next one follows after the
				// interval (every second, every 5 s in a hidden tab).
				var probing = false;
				function probe() {
					if (probing) return;
					probing = true;
					reachable().then(function (up) {
						probing = false;
						checked.textContent = 'Zuletzt geprüft: ' + new Date().toLocaleTimeString('de-DE');
						var before = state.phase;
						dispatch({ type: 'probe', up: up });
						if (before === 'down' && state.phase === 'down') schedule(probe, interval());
					});
				}

				// Tells the server that this page takes over (start.bat opens no tab then) and asks the
				// open app tabs to show their hint. True only if one of them confirmed within 2 s; any
				// failure (no route, 429, CORS) means "no tab", so this page opens the app.
				function askTabs() {
					return request(ATTENTION_URL + '?reason=datei', { method: 'POST' })
						.then(function (response) {
							return response.ok ? response.json() : null;
						})
						.then(function (answer) {
							if (!answer || typeof answer.nonce !== 'string' || !NONCE.test(answer.nonce)) return false;
							if (!(answer.notified > 0)) return false;
							return waitForAck(answer.nonce);
						})
						.catch(function () {
							return false;
						});
				}

				function waitForAck(nonce) {
					var deadline = Date.now() + ACK_WAIT_MS;
					return new Promise(function (resolve) {
						function again() {
							if (Date.now() >= deadline) resolve(false);
							else win.setTimeout(ask, ACK_STEP_MS);
						}
						function ask() {
							request(ATTENTION_URL + '/' + nonce, {})
								.then(function (response) {
									return response.ok ? response.json() : null;
								})
								.then(function (answer) {
									if (answer && answer.acked === true) resolve(true);
									else again();
								}, again);
						}
						ask();
					});
				}

				buttons.now.addEventListener('click', function () {
					dispatch({ type: 'now' });
				});
				buttons.close.addEventListener('click', function () {
					dispatch({ type: 'close' });
				});
				buttons.here.addEventListener('click', function () {
					dispatch({ type: 'here' });
				});
				buttons.cancel.addEventListener('click', function () {
					dispatch({ type: 'cancel' });
				});
				buttons.retry.addEventListener('click', function () {
					if (state.phase === 'down') schedule(probe, 0);
				});
				doc.addEventListener('visibilitychange', function () {
					if (state.phase === 'down' && doc.visibilityState === 'visible') schedule(probe, 0);
				});

				render(null);
				title.focus();
				probe();
			})(window, document);
		</script>
	</body>
</html>
