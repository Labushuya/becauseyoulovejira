version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /web
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      # The type definitions follow the Node.js runtime major (engines: node >= 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
