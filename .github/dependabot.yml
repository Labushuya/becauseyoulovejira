version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /web
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
