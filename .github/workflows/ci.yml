name: CI

# No run on push to main: main only changes through squash merges of pull requests that
# passed this workflow (ruleset .github/rulesets/main.json). The weekly run on main catches
# drift of the runner image and keeps the README badge current; workflow_dispatch runs it
# on demand.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Documentation only means: every changed path (old and new name) is a Markdown file or
      # lies under docs/, except docs/test-manifest.html, which tests/unit/test-manifest.test.mjs
      # reads. An empty list or an API error counts as a code change.
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/test-manifest.html) code=true ;;
              docs/* | *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "Code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    # Required status check of the ruleset for main. For documentation-only pull requests the
    # job is skipped, and GitHub counts a skipped required job as passed. If the classification
    # fails, the job runs anyway.
    name: Check, lint, build and test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    # The start/stop logic tests and the integration tests need Windows PowerShell
    # and the Windows PocketBase binary.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            helpers/mail/package-lock.json

      - name: Cache PocketBase binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/pocketbase.exe
          key: pocketbase-${{ runner.os }}-${{ hashFiles('scripts/fetch-pocketbase.mjs') }}

      # Downloads the pinned version and verifies its pinned SHA256 checksum; with a cache hit
      # the script only confirms the version of the cached binary.
      - name: Fetch PocketBase
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-pocketbase.ps1

      - name: Check, lint, build and test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1

  linux:
    # Same checks, build and tests on Linux with the Linux PocketBase binary (ADR-0028, plan
    # plattformen S0). Tests of the Windows operation layer (Windows PowerShell, byl-functions.ps1)
    # are excluded there (vitest.config.mjs). Not a required check yet; skipped like the Windows
    # job for documentation-only pull requests.
    name: Linux build and test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            helpers/mail/package-lock.json

      - name: Cache PocketBase binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/pocketbase
          key: pocketbase-${{ runner.os }}-${{ hashFiles('scripts/fetch-pocketbase.mjs') }}

      - name: Fetch PocketBase
        run: node scripts/fetch-pocketbase.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix helpers/mail ci

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      # Before the tests: the SPA fallback test serves app/pb_public.
      - name: Build
        run: npm run build

      # helpers/mail/dist/byl-mail for the process tests of the mail helper.
      - name: Build mail helper
        run: node helpers/mail/build.mjs

      - name: Test
        run: npm test
