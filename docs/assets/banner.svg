<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1517;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#152023;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGradient)"/>

  <!-- Decorative motif: Ticket rows on the right -->
  <g transform="translate(1050, 60)">
    <!-- Ticket row 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="none" stroke="#07838F" stroke-width="2" opacity="0.8"/>
      <rect x="8" y="8" width="12" height="24" rx="3" fill="#07838F" opacity="0.7"/>
      <text x="28" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#4BB8C2" font-weight="500">TASK-42</text>
      <circle cx="160" cy="20" r="8" fill="#DDF0F2" opacity="0.6"/>
    </g>

    <!-- Ticket row 2 -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="none" stroke="#07838F" stroke-width="2" opacity="0.6"/>
      <rect x="8" y="8" width="12" height="24" rx="3" fill="#07838F" opacity="0.5"/>
      <text x="28" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#4BB8C2" opacity="0.8" font-weight="500">PROJ-18</text>
      <rect x="145" y="14" width="30" height="12" rx="3" fill="#FBF0DC" opacity="0.5"/>
      <text x="152" y="23" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#7A4E08" opacity="0.7">Wartet</text>
    </g>

    <!-- Ticket row 3 -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="none" stroke="#07838F" stroke-width="2" opacity="0.4"/>
      <rect x="8" y="8" width="12" height="24" rx="3" fill="#07838F" opacity="0.3"/>
      <text x="28" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#4BB8C2" opacity="0.6" font-weight="500">TASK-41</text>
      <circle cx="160" cy="20" r="9" fill="#ECEFF0" opacity="0.4" stroke="#4A585E" stroke-width="1.5"/>
      <text x="155" y="24" font-family="Arial, sans-serif" font-size="12" fill="#4A585E" opacity="0.6" font-weight="bold">✓</text>
    </g>
  </g>

  <!-- Main title -->
  <text x="640" y="130" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#E3ECEE" letter-spacing="-1">
    becauseyoulovejira
  </text>

  <!-- Subtitle -->
  <text x="640" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#8DA1A6" font-weight="400" letter-spacing="0.5">
    A lightweight, local Jira-style task &amp; to-do list
  </text>

  <!-- Accent line -->
  <line x1="420" y1="220" x2="860" y2="220" stroke="#07838F" stroke-width="2" opacity="0.5"/>
</svg>
